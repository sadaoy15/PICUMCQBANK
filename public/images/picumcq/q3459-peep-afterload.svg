<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">PEEP reduces left ventricular transmural pressure</title><desc id="desc">Positive pleural pressure during mechanical ventilation reduces left ventricular afterload in left ventricular failure.</desc><rect width="1000" height="500" fill="#fff"/><text x="34" y="38" font-family="Arial" font-size="22" font-weight="700" fill="#0f172a">Effect of PEEP on left ventricular afterload</text><g font-family="Arial"><rect x="50" y="80" width="390" height="340" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/><text x="155" y="116" font-size="20" font-weight="700" fill="#9a3412">Spontaneous breathing</text><ellipse cx="245" cy="255" rx="96" ry="120" fill="#fecaca" stroke="#dc2626" stroke-width="4"/><text x="202" y="260" font-size="22" font-weight="700" fill="#991b1b">LV</text><path d="M245 110v-45M245 400v45" stroke="#dc2626" stroke-width="5"/><path d="M272 205h100" stroke="#334155" stroke-width="8"/><text x="85" y="390" font-size="17" fill="#9a3412">Negative pleural pressure</text><text x="85" y="414" font-size="17" fill="#9a3412">increases transmural pressure</text><rect x="560" y="80" width="390" height="340" rx="16" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><text x="654" y="116" font-size="20" font-weight="700" fill="#0f766e">Mechanical ventilation + PEEP</text><ellipse cx="755" cy="255" rx="96" ry="120" fill="#ccfbf1" stroke="#0f766e" stroke-width="4"/><text x="712" y="260" font-size="22" font-weight="700" fill="#115e59">LV</text><path d="M755 110v-20M755 400v20" stroke="#0f766e" stroke-width="5"/><path d="M782 205h58" stroke="#334155" stroke-width="8"/><text x="594" y="390" font-size="17" fill="#0f766e">Positive pleural pressure</text><text x="594" y="414" font-size="17" fill="#0f766e">lowers transmural pressure / afterload</text></g><text x="222" y="470" font-family="Arial" font-size="17" fill="#475569">Transmural pressure = intravascular pressure − pleural pressure</text></svg>
