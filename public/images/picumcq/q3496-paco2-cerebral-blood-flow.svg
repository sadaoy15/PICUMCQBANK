<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc"><title id="title">Relationship between PaCO2 and cerebral blood flow</title><desc id="desc">Cerebral blood flow rises as PaCO2 rises. Avoid hypo- and hyperventilation after severe traumatic brain injury.</desc><rect width="880" height="520" fill="#fff"/><text x="36" y="38" font-family="Arial" font-size="22" font-weight="700" fill="#0f172a">PaCO₂ and cerebral blood flow after severe brain injury</text><path d="M100 430V92M100 430H790" stroke="#334155" stroke-width="3"/><text x="332" y="480" font-family="Arial" font-size="17" fill="#334155">PaCO₂ (mm Hg)</text><text x="38" y="290" transform="rotate(-90 38 290)" font-family="Arial" font-size="17" fill="#334155">Cerebral blood flow</text><path d="M115 390 C260 350 365 280 450 220 S650 120 770 100" fill="none" stroke="#0f766e" stroke-width="5"/><path d="M450 430V112" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 8"/><text x="407" y="458" font-family="Arial" font-size="16" fill="#15803d">40</text><text x="388" y="86" font-family="Arial" font-size="16" font-weight="700" fill="#15803d">Normoventilation</text><path d="M280 430V280" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 8"/><text x="242" y="458" font-family="Arial" font-size="16" fill="#b45309">30</text><text x="130" y="250" font-family="Arial" font-size="17" fill="#b45309">Hypocapnia: cerebral vasoconstriction</text><path d="M635 430V145" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 8"/><text x="620" y="458" font-family="Arial" font-size="16" fill="#b91c1c">60</text><text x="548" y="132" font-family="Arial" font-size="17" fill="#b91c1c">Hypercapnia: increased CBF / ICP</text><text x="130" y="508" font-family="Arial" font-size="16" fill="#475569">Clinical target: avoid routine severe hyperventilation; maintain normal ventilation unless directed for refractory intracranial hypertension.</text></svg>
