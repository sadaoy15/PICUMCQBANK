<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">Oxygen content and shunt calculation</title><desc id="desc">At hemoglobin 15 grams per deciliter, end-capillary oxygen content is 20 milliliters per deciliter. The shunt fraction is 30 percent.</desc><rect width="900" height="560" fill="#fff"/><text x="38" y="38" font-family="Arial" font-size="22" font-weight="700" fill="#0f172a">Oxygen content curve and right-to-left shunt fraction</text><path d="M100 430V90M100 430H490" stroke="#334155" stroke-width="3"/><text x="245" y="478" font-family="Arial" font-size="16" fill="#334155">Oxygen saturation (%)</text><text x="38" y="300" transform="rotate(-90 38 300)" font-family="Arial" font-size="16" fill="#334155">O₂ content (mL/dL)</text><path d="M105 425 C180 420 190 362 245 290 S350 145 475 116" fill="none" stroke="#0f766e" stroke-width="5"/><path d="M100 116H476M100 242H370M100 328H305" stroke="#cbd5e1" stroke-dasharray="7 7"/><g font-family="Arial" font-size="16" fill="#334155"><text x="64" y="121">20</text><text x="64" y="247">17</text><text x="64" y="333">10</text><text x="480" y="122" fill="#0f766e">CcO₂ = 20</text><text x="374" y="248">CaO₂ = 17</text><text x="308" y="334">CvO₂ = 10</text><text x="150" y="100">Hemoglobin 15 g/dL</text></g><rect x="540" y="120" width="320" height="266" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="570" y="166" font-family="Arial" font-size="20" font-weight="700" fill="#0f172a">Shunt equation</text><text x="570" y="215" font-family="Arial" font-size="20" fill="#334155">Qs/Qt = (CcO₂ − CaO₂)</text><text x="650" y="245" font-family="Arial" font-size="20" fill="#334155">/ (CcO₂ − CvO₂)</text><text x="570" y="300" font-family="Arial" font-size="22" fill="#0f766e">= (20 − 17) / (20 − 10)</text><text x="570" y="344" font-family="Arial" font-size="26" font-weight="700" fill="#0f766e">= 0.30 (30%)</text></svg>
