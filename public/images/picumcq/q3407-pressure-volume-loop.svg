<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" role="img" aria-labelledby="title desc"><title id="title">Ventricular pressure-volume loops before and after a normal saline bolus</title><desc id="desc">A normal saline bolus increases preload and shifts the pressure-volume loop to the right.</desc><rect width="820" height="520" fill="#fff"/><text x="40" y="38" font-family="Arial" font-size="22" font-weight="700" fill="#0f172a">Ventricular pressure-volume loop: increased preload</text><path d="M110 430V80M110 430H750" stroke="#334155" stroke-width="3"/><text x="350" y="485" font-family="Arial" font-size="18" fill="#334155">Left ventricular volume</text><text x="24" y="270" transform="rotate(-90 24 270)" font-family="Arial" font-size="18" fill="#334155">Pressure</text><path d="M245 390V180 Q245 135 365 135 Q420 135 420 180V390 Q420 420 245 420Z" fill="#cbd5e155" stroke="#64748b" stroke-width="4"/><path d="M305 390V155 Q305 110 490 110 Q555 110 555 155V390 Q555 420 305 420Z" fill="#14b8a655" stroke="#0f766e" stroke-width="5"/><path d="M550 90l-18 16h13v34h10v-34h13z" fill="#0f766e"/><text x="572" y="124" font-family="Arial" font-size="17" font-weight="700" fill="#0f766e">20 mL/kg normal saline</text><text x="225" y="455" font-family="Arial" font-size="16" fill="#475569">Baseline</text><text x="420" y="455" font-family="Arial" font-size="16" fill="#0f766e">After fluid bolus</text><text x="116" y="68" font-family="Arial" font-size="16" fill="#475569">Stroke volume increases as end-diastolic volume rises</text></svg>
