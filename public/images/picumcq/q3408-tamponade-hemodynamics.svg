<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">Hemodynamic findings of cardiac tamponade</title><desc id="desc">Cardiac tamponade causes equalization of right atrial, right ventricular diastolic, and pulmonary capillary wedge pressures, low cardiac output, and low mixed venous oxygen saturation.</desc><rect width="1000" height="480" fill="#fff"/><text x="36" y="38" font-family="Arial" font-size="22" font-weight="700" fill="#0f172a">Hemodynamics that support cardiac tamponade</text><rect x="38" y="72" width="924" height="330" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><g font-family="Arial" font-size="19" fill="#0f172a"><text x="82" y="126" font-weight="700">Measurement</text><text x="540" y="126" font-weight="700">Expected finding</text><path d="M72 146H928M72 204H928M72 262H928M72 320H928" stroke="#99f6e4"/><text x="82" y="184">Right atrial pressure</text><text x="540" y="184">Elevated</text><text x="82" y="242">Right ventricular end-diastolic pressure</text><text x="540" y="242">Elevated and approximately equal to RA pressure</text><text x="82" y="300">Pulmonary capillary wedge pressure</text><text x="540" y="300">Elevated and approximately equal to RA/RV diastolic pressure</text><text x="82" y="358">Cardiac output / mixed venous saturation</text><text x="540" y="358">Low / low</text></g><text x="54" y="442" font-family="Arial" font-size="17" fill="#475569">Key pattern: near-equal diastolic filling pressures in the setting of shock.</text></svg>
